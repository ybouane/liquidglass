<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Nested glass controls</title>
<style>
* { box-sizing: border-box; }
body { position: relative; margin: 0; color: #111; font: 16px system-ui; }
main { position: relative; height: 100vh; overflow-y: auto; }
.background { position: fixed; inset: 0; background: #f5f5f7; z-index: -1; }
ol { position: relative; z-index: 0; margin: 0; padding: 0; list-style: none; }
li { height: 180px; padding: 32px; background: #e13e40; }
li:nth-child(even) { background: #259de0; }
li:nth-child(3n) { background: #39b94c; }
header, footer { position: fixed; left: 16px; right: 16px; display: flex; gap: 12px; pointer-events: none; }
header { top: 16px; justify-content: flex-end; z-index: 3; }
footer { bottom: 16px; z-index: 2; }
header > *, footer > * { pointer-events: auto; }
.glass { position: relative; isolation: isolate; border-radius: 22px; background: #ffffff66; backdrop-filter: blur(16px); border: 1px solid #ffffff77; }
.ready .glass { backdrop-filter: none; background: #ffffff33; }
summary, a { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: inherit; cursor: pointer; }
summary { list-style: none; }
summary::-webkit-details-marker { display: none; }
details { position: relative; }
details p { position: absolute; top: 100%; right: 0; padding: 16px; width: 160px; background: white; }
search { flex: 1; min-width: 0; }
input { width: 100%; height: 44px; padding: 8px 16px; font: inherit; border: 0; border-radius: inherit; background: transparent; color: inherit; }
</style>
</head>
<body>
<header><details><summary class="glass" aria-label="Account">A</summary><p>Account menu</p></details></header>
<main><div class="background" aria-hidden="true"></div><ol>
<li>First conversation</li><li>Second conversation</li><li>Third conversation</li><li>Fourth conversation</li><li>Fifth conversation</li><li>Sixth conversation</li>
</ol></main>
<footer><search class="glass"><input type="search" aria-label="Search" placeholder="Search"></search><a class="glass" href="#new" aria-label="New conversation">+</a></footer>
<script type="module">
import { LiquidGlass } from '/dist/index.js';
window.LiquidGlass = LiquidGlass;
window.start = async (options = {}) => {
  window.instance = await LiquidGlass.init({
    root: document.body,
    backdropRoot: document.querySelector('main'),
    // Back-to-front painting order; header is above footer.
    glassElements: [...document.querySelectorAll('footer .glass'), document.querySelector('summary')],
    defaults: { cornerRadius: 22, blurAmount: 0.1, floating: false, button: false },
    ...options,
  });
  document.body.classList.add('ready');
};
window.addEventListener('scroll', () => window.instance?.markChanged(), true);
</script>
</body>
</html>
